# quarkus-openshift transitively pulls in quarkus-container-image-openshift (S2I builder), which
# conflicts with quarkus-container-image-docker unless the builder is pinned explicitly.
quarkus.container-image.builder=docker
# Needed so the generated manifest actually contains a Route - required for
# quarkus.test.openshift.exposure=external to work (otherwise there's nothing for the launcher to find).
quarkus.openshift.route.expose=true
# Confirmed 2026-08-03: CRC's router serves plain-http routes fine without this. The Red Hat Developer
# Sandbox's router does not (routers answer plain-http with their own "Application is not available" page) - needs
# this set to edge to test the Sandbox route.
quarkus.openshift.route.tls.termination=edge
# route.expose=true means the manifest has a Route, so exposure now auto-detects to "external" anyway -
# kept explicit here for clarity.
quarkus.test.openshift.exposure=external