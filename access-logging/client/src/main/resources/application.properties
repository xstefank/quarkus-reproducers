# Global default - applies to all REST clients
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=10
# Default masked: Authorization,Cookie — set to empty to unmask everything (careful!)
quarkus.rest-client.logging.masked-headers=

# The logger is org.jboss.resteasy.reactive.client.logging.DefaultClientLogger at INFO
# Make sure it's not suppressed:
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=INFO