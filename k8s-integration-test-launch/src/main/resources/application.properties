quarkus.test.kubernetes.registry=localhost:5000
quarkus.kubernetes.ingress.expose=true
# With ingress.expose=true the manifest has an Ingress, so exposure would auto-detect to "external" -
# keep plain `-Dk8s` runs on port-forward (no extra ingress-host config needed); override explicitly to
# test ingress, e.g. -Dquarkus.test.kubernetes.exposure=external -Dquarkus.kubernetes.ingress.host=<app>.<minikube ip>.nip.io
quarkus.test.kubernetes.exposure=port-forward
